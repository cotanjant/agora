<h1>Login</h1>

<form method="post">
    <!--
        we say this line to
        include django's csrf_token
        this is like a safety token between django backend
        and frontend
    -->
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Log in</button>

    <div>
        <p>
            if you don't have a account <a href="{% url 'signup' %}">Sign up</a> <!-- we have to redirect to signup here -->
        </p>
    </div>
</form>
